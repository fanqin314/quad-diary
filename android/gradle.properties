# Gradle 守护进程内存。构建只有一个 Java 模块，2G 够用，别开太大。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 用 AndroidX（androidx.webkit 需要）
android.useAndroidX=true
android.nonTransitiveRClass=true

# 工程放在中文目录（D:\workbuddy\天天记\android）下，AGP 默认会直接报错。
# 关掉这项检查后 aapt2 与 dx 在本机实测可用；如果你的机器上仍报错，
# 把整个 android/ 目录挪到纯英文路径（如 D:\code\quaddiary）再编译。
android.overridePathCheck=true
