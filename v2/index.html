<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F6F2">
<title>四象限日记 · QUAD DIARY</title>
<style>
  :root{
    --paper:#F7F6F2; --ink:#15161A; --dim:#8A8B93; --rule:#D9D8D2; --rule2:#E8E7E1;
    --acc:#2438C9;
    --serif:Georgia,"Noto Serif SC","Songti SC",serif;
    --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{background:var(--paper);font-family:var(--sans);color:var(--ink);overflow:hidden}
  .app{width:100%;max-width:430px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
       position:relative;overflow:hidden;background:var(--paper)}

  .bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
       padding:calc(env(safe-area-inset-top) + 12px) 22px 4px;font-size:9.5px;letter-spacing:.3em;color:var(--dim);font-weight:600}
  .bar .clock{font-family:var(--serif);font-size:11px;letter-spacing:.06em}

  .wrap{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 22px}
  .wrap::-webkit-scrollbar{display:none}
  .screen{display:none;flex-direction:column;min-height:100%;padding-bottom:6px}
  .screen.on{display:flex}

  /* 日期条 */
  .daterow{display:flex;align-items:center;gap:8px;padding-top:2px}
  .dt{font-family:var(--serif);font-size:31px;line-height:1.1;letter-spacing:-.02em}
  .dt small{font-size:12.5px;color:var(--dim);margin-left:7px;letter-spacing:.02em}
  .navb{width:26px;height:26px;border:1px solid var(--rule);border-radius:999px;background:none;
        color:var(--dim);font-size:14px;line-height:1;display:grid;place-items:center;flex:none}
  .pill{margin-left:auto;border:1px solid var(--ink);border-radius:999px;background:none;
        color:var(--ink);font-size:10.5px;letter-spacing:.06em;padding:4px 10px}
  .back{border:0;background:none;color:var(--dim);font-size:12px;padding:4px 0;letter-spacing:.04em}
  .tabs{margin-left:auto;display:flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
  .tabs button{font:inherit;font-size:10.5px;padding:4px 10px;letter-spacing:.06em;border:0;background:none;color:rgba(20,20,20,.55)}
  .tabs button.on{background:var(--ink);color:var(--paper)}

  /* 仪表盘 */
  .dash{display:flex;align-items:baseline;gap:9px;margin-top:13px;padding-top:11px;border-top:1px solid var(--rule)}
  .dash b{font:400 22px/1 var(--serif);letter-spacing:-.01em}
  .dash b i{font-style:normal;font-size:11.5px;color:var(--dim);margin-left:1px}
  .dmap{display:flex;gap:2px;align-self:center}
  .dmap i{width:7px;height:7px;display:block;border-radius:1px;box-shadow:inset 0 0 0 1px var(--rule)}
  .dmap i.on{background:var(--ink);box-shadow:none}
  .dsay{font-size:11px;color:var(--dim);letter-spacing:.02em}
  .dright{margin-left:auto;font-size:10.5px;color:var(--dim);letter-spacing:.04em}

  .yday{display:flex;align-items:center;gap:8px;margin-top:9px;padding:8px 11px;
        border:1px solid var(--rule);border-radius:2px;font-size:11px;color:var(--dim)}
  .yday b{color:var(--ink);font-weight:600;font-size:12px}
  .yact{margin-left:auto;display:flex;gap:5px}
  .yact button{font-size:10px;padding:3px 8px;border:1px solid var(--rule);border-radius:999px;background:none;color:rgba(20,20,20,.55)}
  .yact button.f{border-color:var(--acc);color:var(--acc)}
  .hide{display:none!important}

  .course{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11.5px;color:var(--dim)}
  .course b{color:var(--ink);font-weight:600;font-size:12px}
  .course .r{margin-left:auto;font-size:12px}

  /* 四格地图 */
  .qmap{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
  .qtile{position:relative;text-align:left;border:1px solid var(--rule);border-radius:2px;
         background:rgba(255,255,255,.45);padding:10px 11px 10px 13px;min-height:78px;
         display:flex;flex-direction:column;gap:7px;font:inherit;color:inherit;cursor:pointer}
  .qtile .qh{display:flex;align-items:baseline;gap:5px}
  .qtile .qi{font-family:var(--serif);font-size:10px;color:var(--dim);font-style:normal;letter-spacing:.06em}
  .qtile .qn{font-size:10px;letter-spacing:.03em;color:rgba(20,20,20,.42)}
  .qtile .qc{margin-left:auto;font-family:var(--serif);font-size:10px;color:var(--dim)}
  .qtile .qw{display:flex;flex-wrap:wrap;gap:2px 8px;overflow:hidden;max-height:34px}
  .qtile .qw span{font-size:11.5px;line-height:1.45}
  .qtile .qw em{font-style:normal;font-size:11px;line-height:1.45;color:rgba(20,20,20,.26)}
  .qtile.on{background:var(--ink);border-color:var(--ink)}
  .qtile.on .qi{color:rgba(255,255,255,.34)}
  .qtile.on .qn{color:rgba(255,255,255,.5)}
  .qtile.on .qc{color:rgba(255,255,255,.4)}
  .qtile.on .qw span{color:var(--paper)}
  .qtile.on .qw em{color:rgba(255,255,255,.4)}
  .qtile.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;background:var(--acc)}

  /* 桌面 */
  .desk{flex:1 1 auto;min-height:0;margin-top:9px;border:1px solid var(--ink);border-radius:2px;background:rgba(255,255,255,.62);
        padding:12px 13px 14px;display:flex;flex-direction:column}
  .dh{display:flex;align-items:baseline;gap:7px}
  .dh .n{font-family:var(--serif);font-size:16px;line-height:1;color:rgba(20,20,20,.28)}
  .dh .t{font-size:12.5px;font-weight:600}
  .dh .s{margin-left:auto;font-size:10px;color:var(--dim);letter-spacing:.06em}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{font-size:12.5px;line-height:1;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;
        background:none;color:rgba(20,20,20,.45)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
  .notewrap{margin-top:12px;border-top:1px solid var(--rule);padding-top:9px;flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  .note{flex:1 1 auto;width:100%;border:0;background:none;resize:none;outline:none;padding:0;min-height:40px;
        font-family:var(--serif);font-size:13px;line-height:1.7;color:var(--ink)}
  .note::placeholder{color:rgba(20,20,20,.26)}

  /* 课表 */
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
  .days button{font:inherit;font-size:11px;padding:6px 0;border:1px solid var(--rule);border-radius:2px;background:none;color:rgba(20,20,20,.45)}
  .days button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .tl{margin-top:14px}
  .ev{display:flex;gap:12px}
  .ev .tm{width:34px;flex:none;text-align:right;font-family:var(--serif);font-size:10px;color:var(--dim);padding-top:4px}
  .ev .bd{flex:1;border-left:1px solid var(--rule);padding:0 0 18px 14px;position:relative}
  .ev .bd::before{content:"";position:absolute;left:-3.5px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
  .ev:last-child .bd{padding-bottom:0}
  .ev .nm{font-size:13px;font-weight:600;line-height:1.35}
  .ev .nm .m{float:right;font-size:9.5px;font-weight:400;color:var(--dim);padding-top:3px}
  .ev .gh{font-size:11px;color:rgba(20,20,20,.26);margin-top:5px;border:0;background:none;padding:0;font-family:inherit}
  .ev .nt{width:100%;border:0;border-bottom:1px solid var(--rule2);background:none;outline:none;padding:3px 0 4px;
        font-family:var(--serif);font-size:12.5px;line-height:1.6;color:var(--ink);min-height:24px;resize:none}
  .ev .nt::placeholder{color:rgba(20,20,20,.24)}
  .ev.free .bd::before{background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule)}
  .ev.free .nm{font-weight:400;font-size:12px;color:var(--dim)}
  .sugg{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .sugg button{font:inherit;font-size:10.5px;padding:4px 8px;border:1px solid var(--rule);border-radius:999px;
        background:none;color:rgba(20,20,20,.5)}
  .sugg button:active{background:var(--ink);color:var(--paper)}
  .plan{font-family:var(--serif);font-size:12.5px;color:var(--ink);margin-top:6px}

  /* 任务 */
  .sec{display:flex;align-items:baseline;gap:7px;margin-top:16px;font-size:9.5px;letter-spacing:.22em;color:var(--dim)}
  .sec b{color:var(--ink);font-weight:600;font-size:10.5px;letter-spacing:.12em}
  .sec .r{margin-left:auto;letter-spacing:.04em}
  .dly{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule2)}
  .dly .info{flex:1;min-width:0}
  .dly .tt{font-size:13px;font-weight:500}
  .dly .meta{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.02em}
  .dly .dots{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
  .dly .dots i{width:11px;height:11px;border-radius:2px;box-shadow:inset 0 0 0 1px var(--rule)}
  .dly .dots i.on{background:var(--ink);box-shadow:none}
  .dly .plus{width:38px;height:38px;flex:none;border:1px solid var(--ink);border-radius:999px;background:none;
        font-size:16px;line-height:1;color:var(--ink);display:grid;place-items:center}
  .dly .plus.full{background:var(--ink);color:var(--paper)}
  .dly .del{border:0;background:none;color:rgba(20,20,20,.25);font-size:14px;padding:4px}
  .empty{font-size:11.5px;color:rgba(20,20,20,.28);padding:10px 0}

  .pomo{display:flex;align-items:center;gap:10px;margin-top:12px;border:1px solid var(--ink);border-radius:2px;padding:9px 12px}
  .pomo .big{font-family:var(--serif);font-size:21px;line-height:1}
  .pomo .cap{font-size:9.5px;color:var(--dim);letter-spacing:.12em}
  .pomo .go{margin-left:auto;background:var(--ink);color:var(--paper);border:0;border-radius:3px;padding:7px 13px;font-size:11.5px;letter-spacing:.06em}

  .task{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--rule2);font-size:12.5px}
  .task:last-of-type{border-bottom:0}
  .box{width:14px;height:14px;border:1px solid rgba(20,20,20,.45);border-radius:2px;flex:none;background:none;padding:0}
  .task.done .box{background:var(--ink);border-color:var(--ink)}
  .task.done .tx{color:rgba(20,20,20,.3);text-decoration:line-through}
  .task .st{margin-left:auto;font-family:var(--serif);font-size:9.5px;color:var(--dim)}
  .task .mv{margin-left:auto;font-size:9.5px;font-family:inherit;border:1px solid var(--rule);background:none;border-radius:99px;padding:2px 8px;color:var(--ink);cursor:pointer}
  .task .mv:active{transform:scale(.94)}
  .addrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding-top:11px;border-top:1px solid var(--rule)}
  .addrow input{flex:1 1 120px;min-width:0;border:0;border-bottom:1px solid var(--rule);background:none;outline:none;
        font-family:inherit;font-size:12.5px;padding:4px 0 5px;color:var(--ink)}
  .addrow input.due{flex:0 0 86px;text-align:center;font-size:11px;border-bottom:1px solid var(--rule2)}
  .addrow input::placeholder{color:rgba(20,20,20,.26)}
  .addrow .q{flex:1 1 100%;display:flex;gap:5px;margin-top:3px}
  .addrow .q button{flex:1;text-align:center;font:inherit;font-size:10px;padding:6px 0;border:1px solid var(--rule);
        border-radius:2px;background:none;color:rgba(20,20,20,.45)}
  .addrow .q button.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .addrow .go{flex:none;width:auto;margin-left:auto;margin-top:3px;font:inherit;font-size:11.5px;padding:7px 16px;
        border:1px solid var(--ink);border-radius:99px;background:none;color:var(--ink);letter-spacing:.04em}

  /* 甘特 */
  .gantt{margin-top:12px;overflow-x:auto;padding-bottom:4px}
  .gantt::-webkit-scrollbar{display:none}
  .gwrap{display:flex;flex-direction:column;gap:5px;width:max-content}
  .ghead{display:grid;grid-template-columns:repeat(14,34px)}
  .grow{display:grid;grid-template-columns:repeat(14,34px);align-items:center;height:22px}
  .ghead div{font-size:9px;color:var(--dim);text-align:center;font-family:var(--serif)}
  .ghead div.w{color:var(--ink);font-weight:700}
  .grow .bar{height:22px;border-radius:2px;background:var(--ink);color:var(--paper);font-size:9.5px;
        padding:0 6px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;grid-row:1}
  .grow .bar.t1{background:none;box-shadow:none;color:var(--ink);padding-left:3px;overflow:visible;white-space:nowrap}
  .grow .bar.done{background:none;box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);text-decoration:line-through}
  .gtoday{position:relative}

  /* 回看 */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
  .cal .wd{font-size:9px;color:var(--dim);text-align:center;letter-spacing:.06em}
  .cal .d{aspect-ratio:1;border:1px solid var(--rule);border-radius:2px;background:none;
        display:grid;place-items:center;font-size:10px;color:rgba(20,20,20,.35);font-family:var(--serif)}
  .cal .d.x{border:0;color:rgba(20,20,20,.14)}
  .cal .d.f1{background:rgba(21,22,26,.14);border-color:transparent;color:rgba(20,20,20,.5)}
  .cal .d.f2{background:rgba(21,22,26,.32);border-color:transparent;color:var(--paper)}
  .cal .d.f3{background:rgba(21,22,26,.58);border-color:transparent;color:var(--paper)}
  .cal .d.f4{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .cal .d.today{box-shadow:0 0 0 1.5px var(--acc)}
  .ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
  .ym{aspect-ratio:1;border:1px solid var(--rule);border-radius:2px;display:flex;flex-direction:column;
      justify-content:space-between;padding:7px 8px;background:none;font:inherit;color:var(--ink)}
  .ym .n{font-family:var(--serif);font-size:13px}
  .ym .v{font-family:var(--serif);font-size:9.5px;color:var(--dim);align-self:flex-end}
  .ym.s1{background:rgba(21,22,26,.14)}
  .ym.s2{background:rgba(21,22,26,.32);color:var(--paper)}
  .ym.s3{background:rgba(21,22,26,.58);color:var(--paper)}
  .ym.s4{background:var(--ink);color:var(--paper)}
  .ym.s2 .v,.ym.s3 .v,.ym.s4 .v{color:rgba(255,255,255,.7)}
  .quote{margin-top:10px;padding:10px 0 0 13px;border-left:2px solid var(--rule);
        font-family:var(--serif);font-size:12.5px;line-height:1.65;color:rgba(20,20,20,.52)}
  .krow{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule2);font-size:12.5px}
  .krow .n{font-family:var(--serif);font-size:10px;color:var(--dim);width:14px;flex:none;padding-top:3px}
  .krow .t{font-size:10px;letter-spacing:.12em;color:var(--dim)}
  .krow .w{margin-top:5px;font-size:13px;line-height:1.5}
  .krow .q{margin-top:4px;font-family:var(--serif);font-size:12px;line-height:1.6;color:rgba(20,20,20,.5)}
  .streak{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule2);font-size:12px}
  .streak .nm{flex:1;min-width:0}
  .streak .v{font-family:var(--serif);font-size:11px;color:var(--dim);white-space:nowrap}

  /* 底栏 */
  .dock{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;
        border-top:1px solid var(--rule);padding:10px 6px calc(14px + env(safe-area-inset-bottom));background:var(--paper)}
  .dock button{display:grid;place-items:center;border:0;background:none;padding:8px 0;color:var(--ink);opacity:.34}
  .dock button.on{opacity:1}
  .dock svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.35}
  .dock .fab{opacity:1;width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--paper);
        display:grid;place-items:center;margin-top:-25px;box-shadow:0 8px 20px rgba(20,20,20,.28),0 0 0 6px var(--paper)}
  .dock .fab svg{width:21px;height:21px;fill:var(--paper);stroke:none}

  /* 帘子 */
  .scrim{position:absolute;inset:0;background:rgba(20,20,26,.3);z-index:8;opacity:0;pointer-events:none;transition:opacity .22s}
  .curtain{position:absolute;left:0;right:0;top:0;z-index:9;background:var(--paper);
           border-radius:0 0 20px 20px;padding:20px 20px 26px;display:flex;flex-direction:column;
           background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.013) 0 1px,transparent 1px 24px);
           transform:translateY(-102%);transition:transform .3s cubic-bezier(.22,.9,.25,1),visibility .3s;
           visibility:hidden;box-shadow:none}
  .curtain.on{transform:translateY(0);visibility:visible;box-shadow:0 22px 44px rgba(0,0,0,.28)}
  .scrim.on{opacity:1;pointer-events:auto}
  .curtain .ch{display:flex;align-items:baseline;gap:8px}
  .curtain .ch b{font-family:var(--serif);font-size:17px;font-weight:400}
  .curtain .ch .c{margin-left:auto;font-family:var(--serif);font-size:10px;color:var(--dim);letter-spacing:.06em}
  .curtain .ta{margin-top:11px;border:1px solid var(--rule);border-radius:3px;padding:12px 13px;min-height:96px;
        font-family:var(--serif);font-size:16.5px;line-height:1.6;color:var(--ink);background:rgba(255,255,255,.5);
        outline:none;resize:none;width:100%}
  .curtain .ta::placeholder{color:rgba(20,20,20,.26)}
  .curtain .rc{margin-top:14px;font-size:9.5px;letter-spacing:.2em;color:var(--dim)}
  .curtain .rl{display:flex;gap:9px;padding:7px 0;border-top:1px solid var(--rule);font-size:11.5px;color:rgba(20,20,20,.6)}
  .curtain .rl i{font-style:normal;font-family:var(--serif);font-size:10px;color:var(--dim);width:38px;flex:none;padding-top:1px}
  .curtain .rlist{max-height:150px;overflow:auto}
  .curtain .foot{margin-top:auto;display:flex;gap:9px;align-items:center;padding-top:16px}
  .curtain .foot .h{margin-right:auto;font-size:10px;color:var(--dim);letter-spacing:.06em}
  .curtain .btn{font-size:12px;padding:9px 15px;border:1px solid rgba(20,20,20,.4);border-radius:3px;background:none;color:var(--ink)}
  .curtain .btn.p{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ===== 过渡：只回应操作，不自己动 ===== */
.screen.on{animation:fadeUp .26s cubic-bezier(.22,.9,.25,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.qtile{transition:background .18s,border-color .18s,transform .12s}
.qtile:active{transform:scale(.985)}
.chip{transition:background .16s,color .16s,border-color .16s,transform .1s}
.chip:active{transform:scale(.94)}
.dly .plus{transition:transform .12s,background .18s,color .18s}
.dly .plus:active{transform:scale(.9)}
.plus.hit{animation:pop .34s cubic-bezier(.2,.9,.3,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.dly .dots i{transition:background .2s,transform .2s}
.task .box{transition:background .16s,border-color .16s,transform .1s}
.task:active .box{transform:scale(.9)}
.cal .d{transition:background .18s,color .18s,transform .12s}
.cal .d:active{transform:scale(.94)}
.ym{transition:background .18s,color .18s,transform .12s}
.ym:active{transform:scale(.97)}
.addrow .go{transition:transform .12s,opacity .18s}
.addrow .go:active{transform:scale(.985);background:var(--ink);color:var(--paper)}
.navb,.pill,.tabs button,.days button{transition:background .16s,color .16s,border-color .16s}
.desk,.card,.grow .bar{transition:background .18s,border-color .18s}
.desk.in{animation:fadeUp .22s cubic-bezier(.22,.9,.25,1)}

.wkp{border-bottom:1px solid var(--rule);padding:9px 0 7px}
.wkp .h{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--dim)}
.wkp .h b{font-size:12.5px;color:var(--ink);font-weight:500}
.wkp .h .sub{flex:1;font-size:10px}
.wkp .h .pick{margin-left:auto;font-size:10px;border:1px solid var(--rule);background:none;border-radius:99px;padding:3px 10px;color:var(--ink);cursor:pointer;font-family:inherit}
.wl{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;color:var(--ink)}
.wl i{width:11px;height:11px;border:1px solid var(--ink);border-radius:2px;flex:none}
.wl.on i{background:var(--ink)}
.wl.on span{text-decoration:line-through;opacity:.45}
.wl em{font-style:normal;font-size:9.5px;color:var(--dim);border:1px solid var(--rule);border-radius:99px;padding:1px 6px;margin-left:auto}
.picked{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pt{font-size:11px;font-family:inherit;border:1px solid var(--rule);background:none;border-radius:99px;padding:4px 9px;color:rgba(20,20,20,.6);cursor:pointer}
.pt.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.goal{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--rule2);font-size:13px}
.goal .gp{font-size:10px;color:var(--dim);margin-left:auto}
.goal .gdel{border:0;background:none;color:var(--dim);font-size:13px;cursor:pointer;font-family:inherit}
select#tGoal{flex:1 1 100%;font-family:inherit;font-size:11px;border:1px solid var(--rule);background:none;border-radius:99px;padding:6px 8px;color:var(--ink);margin-top:3px;width:100%}
.gt{font-size:9.5px;color:var(--dim);border:1px solid var(--rule);border-radius:99px;padding:1px 6px;margin-left:6px}

.cbar{display:flex;align-items:center;gap:10px;padding:4px 0 10px}
.cbar b{font-family:var(--serif);font-size:17px;font-weight:400}
.cbar span{margin-left:auto;font-size:10px;color:var(--dim);font-family:var(--serif)}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.mcal .wd{font-size:9px;color:var(--dim);text-align:center;padding-bottom:6px;font-family:var(--serif)}
.mc{aspect-ratio:1;border:1px solid var(--rule2);background:none;font-family:inherit;color:var(--ink);position:relative;padding:4px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.mc i{font-style:normal;font-size:11px;font-family:var(--serif)}
.mc.out{color:rgba(20,20,20,.16);border-color:transparent}
.mc.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.mc.sel{background:var(--ink);color:var(--paper)}
.mc.sel.today{box-shadow:none}
.mk{font-size:8px;line-height:1;border-radius:99px;min-width:12px;padding:1px 0;text-align:center}
.mk.t{background:var(--ink);color:var(--paper)}
.mk.d{background:none;color:var(--dim);border:1px solid var(--rule2)}
.mc.sel .mk.t{background:var(--paper);color:var(--ink)}
.dpanel{margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.dpanel .dh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.dpanel .dh .n{font-family:var(--serif);font-size:14px}
.dpanel .dh .t{font-size:10px;color:var(--dim)}
.dpanel .dh .s{margin-left:auto;font-size:10px;color:var(--dim)}

/* ===== 周视图日程（照参考文件的结构） ===== */
.calwrap{margin-top:10px;border-top:1px solid var(--rule)}
.calhead{display:grid;grid-template-columns:34px repeat(7,1fr);padding:8px 0 6px;border-bottom:1px solid var(--rule)}
.calhead div{font-size:9px;color:var(--dim);text-align:center;font-family:var(--serif)}
.calhead div.on{color:var(--ink);font-weight:700}
.calbody{display:flex;margin-top:2px}
.calaxis{width:34px;flex:none}
.calaxis div{height:46px;font-size:9px;color:var(--dim);text-align:right;padding-right:6px;font-family:var(--serif);transform:translateY(-5px)}
.calcols{flex:1;display:grid;grid-template-columns:repeat(7,1fr);position:relative}
.calcol{border-left:1px solid var(--rule2);position:relative}
.calcol .hr{height:46px;border-bottom:1px solid var(--rule2)}
.cblock{position:absolute;left:1px;right:1px;border-radius:2px;padding:2px 3px;font-size:9px;line-height:1.25;overflow:hidden}
.cblock.cls{background:rgba(21,22,26,.07);color:rgba(20,20,20,.62);box-shadow:inset 2px 0 0 var(--acc)}
.cblock.task{background:var(--ink);color:var(--paper)}
.cblock.done{background:none;box-shadow:inset 0 0 0 1px var(--ink);color:var(--ink);text-decoration:line-through}
.allday{display:grid;grid-template-columns:34px repeat(7,1fr);gap:0;margin-top:6px}
.allday .lb{font-size:9px;color:var(--dim);text-align:right;padding-right:6px;font-family:var(--serif)}
.allday .cell{min-height:16px;font-size:9px;line-height:1.3;padding:0 2px;color:rgba(20,20,20,.55);border-left:1px solid var(--rule2)}
.sparklist .rl{display:flex;gap:9px;padding:8px 0;border-top:1px solid var(--rule2);font-size:11.5px;color:rgba(20,20,20,.62)}
.sparklist .rl i{font-style:normal;font-family:var(--serif);font-size:10px;color:var(--dim);width:40px;flex:none;padding-top:1px}</style>
</head>
<body>
<div class="app">
  <header class="bar"><span>QUAD DIARY</span><span class="clock" id="clock">--:--</span></header>
  <main class="wrap" id="wrap">

    <!-- ===== 今天 ===== -->
    <section class="screen on" id="s-today">
      <div class="daterow">
        <button class="navb" id="prevDay">‹</button>
        <div class="dt"><span id="dateLabel">—</span><small id="dateWeek"></small></div>
        <button class="navb" id="nextDay">›</button>
        <button class="pill" id="todayBtn">今天</button>
      </div>
      <div class="dash">
        <b id="dashNum">0<i>/4</i></b>
        <span class="dmap" id="dmap"></span>
        <span class="dsay" id="dashSay">今天还空着</span>
        <span class="dright" id="dashStreak"></span>
      </div>
      <div class="wkp" id="wkp"></div>
      <div class="yday hide" id="yday">
        <span>昨天写了</span><b id="ydayText">—</b>
        <span class="yact"><button data-a="done">做到了</button><button data-a="miss">没做</button></span>
      </div>
      <div class="course" id="courseRow"><b>今天上的课</b><span id="courseMeta">—</span><span class="r">›</span></div>
      <div class="qmap" id="qmap"></div>
      <div class="desk" id="desk"></div>
    </section>

    <!-- ===== 课程表 ===== -->
    <section class="screen" id="s-week">
      <div class="daterow">
        <div class="dt">课程表<small id="wkSub"></small></div>
      </div>
      <div class="days" id="days"></div>
      <div class="tl" id="tl"></div>
    </section>

    <!-- ===== 任务 ===== -->
    <section class="screen" id="s-tasks">
      <div class="daterow">
        <div class="dt">任务</div>
        <span class="tabs" id="taskTabs"><button data-v="list" class="on">清单</button><button data-v="cal">日历</button></span>
      </div>
      <div id="taskBody"></div>
    </section>

    <!-- ===== 回看 ===== -->
    <section class="screen" id="s-review">
      <div class="daterow">
        <button class="back hide" id="revBack">‹ 返回</button>
        <div class="dt" id="revTitle">回看</div>
        <span class="tabs" id="revSeg"><button data-v="year" class="on">年</button><button data-v="month">月</button><button data-v="day">日</button></span>
      </div>
      <div id="revBody"></div>
    </section>

  </main>

  <nav class="dock" id="dock">
    <button class="on" data-s="today" aria-label="今天"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
    <button data-s="week" aria-label="课程表"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M10 10v10M16 10v10"/></svg></button>
    <button class="fab" id="fab" aria-label="记一句灵感"><svg viewBox="0 0 24 24"><path d="M13.4 2.6 5.8 13.6h5.2l-1 7.8 7.6-10.9h-5.2z"/></svg></button>
    <button data-s="tasks" aria-label="任务"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8.5 12.2l2.6 2.6 4.6-5.6"/></svg></button>
    <button data-s="review" aria-label="回看"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg></button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="curtain" id="curtain">
    <div class="ch"><b>记一句</b><span class="c"><span id="sparkLen">0</span> / 500</span></div>
    <textarea class="ta" id="sparkTa" maxlength="500" placeholder="想到什么就先记下来，不用分格子"></textarea>
    <div class="rc">最 近</div>
    <div class="rlist" id="sparkList"></div>
    <div class="foot"><span class="h">先存着</span>
      <button class="btn" id="sparkCancel">取消</button><button class="btn p" id="sparkSave">存下</button></div>
  </div>
</div>

<script src="./kcb-data.js"></script>
<script>
/* ============================================================
   数据：不预填。第一次打开就是空的。
   ============================================================ */
const KEY='qd2-v1';
const QUADS=[
  {k:'past_event',    n:'过去 · 事件', hAM:'昨天留下了什么', hPM:'今天发生了什么 · 点一下就好'},
  {k:'past_emotion',  n:'过去 · 情绪', hAM:'昨天的心情落在哪儿', hPM:'今天的心情落在哪儿'},
  {k:'future_event',  n:'未来 · 事件', hAM:'今天想做点什么', hPM:'明天想做点什么'},
  {k:'future_emotion',n:'未来 · 情绪', hAM:'想带着什么心情出门', hPM:'想带着什么心情睡下'}
];
const EVENT_TAGS=['工作/学习','通勤','家务','社交','休息','开会','运动','吃饭','购物','睡觉','刷手机','其他'];
const MOOD_TAGS=['雀跃','开心','期待','感激','焦虑','烦躁','生气','紧张','疲惫','低落','孤单','麻木','平静','安心','放松','满足'];
const TAGS={past_event:EVENT_TAGS,future_event:EVENT_TAGS,past_emotion:MOOD_TAGS,future_emotion:MOOD_TAGS};
const TQ=['重要 · 紧急','重要 · 不紧急','紧急 · 不重要','都不'];
const DAILY_MAX=3;
const GOAL_MAX=3;
function wkStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function wkKey(d){return keyOf(wkStart(d));}
function weekIds(k){return ((DB.weeks||{})[k]||[]).filter(id=>DB.tasks.some(t=>t.id===id));}
function setWeekIds(k,ids){DB.weeks=DB.weeks||{};DB.weeks[k]=ids.slice(0,3);save();}
function goalOf(t){return t.goal?DB.goals.find(g=>g.id===t.goal):null;}
let wkPickOpen=false;

function uid(){return 'x'+Math.random().toString(36).slice(2,9);}
function blankDay(){const q={};QUADS.forEach(x=>q[x.k]={tags:[],note:''});return {quads:q,courseNotes:{},gaps:{}};}
function load(){
  try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');
    if(raw&&typeof raw==='object'){
      raw.days=raw.days||{}; raw.tasks=raw.tasks||[]; raw.daily=raw.daily||[]; raw.sparks=raw.sparks||[]; raw.yday=raw.yday||null; raw.goals=raw.goals||[]; raw.weeks=raw.weeks||{};
      return raw;
    }
  }catch(e){}
  return {days:{},tasks:[],daily:[],sparks:[],yday:null,goals:[],weeks:{}};
}
let DB=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
function day(k,create=true){
  if(!DB.days[k]){
    if(!create)return blankDay();
    DB.days[k]=blankDay();
  }
  const d=DB.days[k];
  d.quads=d.quads||{}; QUADS.forEach(q=>{if(!d.quads[q.k])d.quads[q.k]={tags:[],note:''};});
  d.courseNotes=d.courseNotes||{}; d.gaps=d.gaps||{};
  return d;
}
function filled(s){return s&&(s.tags.length>0||(s.note||'').trim().length>0);}
function todayKey(){return keyOf(new Date());}

let cur=new Date(); cur.setHours(0,0,0,0);
let openQuad=null;
let revView='year', revMonth=new Date().getMonth(), revDate=null;
let taskView='list', wkDay=new Date(); wkDay.setHours(0,0,0,0);
let calMonth=new Date(); calMonth.setDate(1); let calDay=null;
let newTaskQ=0;
let newQuota=1;

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WEEK='日一二三四五六';
const dLabel=d=>(d.getMonth()+1)+'月'+d.getDate()+'日';
const dShort=d=>(d.getMonth()+1)+'.'+d.getDate();
function isDusk(){const h=new Date().getHours();return h>=15||h<5;}
function quadOrder(){return isDusk()
  ?['past_event','past_emotion','future_event','future_emotion']
  :['future_event','future_emotion','past_event','past_emotion'];}

/* ============================================================
   今天
   ============================================================ */
function renderToday(){
  $('#dateLabel').textContent=dLabel(cur);
  $('#dateWeek').textContent='周'+WEEK[cur.getDay()];
  const d=day(keyOf(cur),false);
  const states=QUADS.map(q=>d.quads[q.k]||{tags:[],note:''});
  const n=states.filter(filled).length;
  $('#dashNum').innerHTML=n+'<i>/4</i>';
  $('#dmap').innerHTML=states.map(s=>'<i class="'+(filled(s)?'on':'')+'"></i>').join('');
  $('#dashSay').textContent=n===0?'今天还空着':(n===4?'四格都落了笔':'还差 '+(4-n)+' 格');
  // 连续天数：从今天往前数
  let streak=0; const dt=new Date(cur);
  while(streak<4000){
    const dd=day(keyOf(dt),false);
    if(!QUADS.some(q=>filled(dd.quads[q.k])))break;
    streak++; dt.setDate(dt.getDate()-1);
  }
  $('#dashStreak').textContent=streak?('连续 '+streak+' 天'):'';
  // 昨天：只有昨天在「未来·事件」里写了东西才问
  const y1=new Date(cur); y1.setDate(y1.getDate()-1);
  const yd=day(keyOf(y1),false).quads.future_event;
  const y=DB.yday&&DB.yday.text;
  const showY=(keyOf(y1)===DB.yday?.day)||(yd.tags.length&&y);
  if(DB.yday&&DB.yday.day===keyOf(y1)&&DB.yday.text){
    $('#yday').classList.remove('hide');
    $('#ydayText').textContent=DB.yday.text;
    $$('#yday .yact button').forEach(b=>b.classList.toggle('f',DB.yday.state===b.dataset.a));
  }else $('#yday').classList.add('hide');

  const cs=coursesOn(cur);
  $('#courseMeta').textContent=cs.length?('· '+cs.length+' 节'):'· 没课';
  renderQmap(); renderDesk(); renderWkp();
}
function renderWkp(){
  const host=$('#wkp'); if(!host)return;
  const k=wkKey(cur), ids=weekIds(k);
  const ts=ids.map(id=>DB.tasks.find(t=>t.id===id)).filter(Boolean);
  const dn=ts.filter(t=>t.done).length;
  if(wkPickOpen){
    const pool=DB.tasks.filter(t=>!t.done&&ids.indexOf(t.id)<0).slice(0,12);
    host.innerHTML='<div class="h"><b>挑本周的 3 件</b><button class="pick" data-close="1">好</button></div>'
      +(ts.length?'<div class="picked">'+ts.map(t=>'<button class="pt on" data-unpick="'+t.id+'">'+esc(t.title)+' ×</button>').join('')+'</div>':'')
      +(pool.length?'<div class="picked">'+pool.map(t=>'<button class="pt" data-pick="'+t.id+'">'+esc(t.title)+'</button>').join('')+'</div>':'<div class="empty">任务里没有可挑的了</div>');
    return;
  }
  if(!ts.length){
    host.innerHTML='<div class="h"><b>本周</b><span class="sub">还没挑事</span><button class="pick" data-open="1">挑 3 件</button></div>';
    return;
  }
  host.innerHTML='<div class="h"><b>本周 '+dn+'/'+ts.length+'</b><span class="sub">'+(dn===ts.length?'都做完了':(dn?'继续':'还没动'))+'</span><button class="pick" data-open="1">换</button></div>'
    +ts.map(t=>'<div class="wl'+(t.done?' on':'')+'" data-wtid="'+t.id+'"><i></i><span>'+esc(t.title)+'</span>'
      +(t.goal&&goalOf(t)?'<em>'+esc(goalOf(t).name)+'</em>':'')+'</div>').join('');
}
function parseDue(s){
  s=String(s||'').trim(); if(!s)return '';
  const m=s.match(/^(\d{1,2})[.\-\/月](\d{1,2})/);
  if(m){const mo=+m[1], dd=+m[2]; if(mo>=1&&mo<=12&&dd>=1&&dd<=31)return new Date().getFullYear()+'-'+pad(mo)+'-'+pad(dd);}
  return '';
}
function goalsHTML(){
  const gs=DB.goals||[];
  let h='<div class="sec"><b>目标</b>最多 '+GOAL_MAX+' 个<span class="r">'+gs.length+' / '+GOAL_MAX+'</span></div>';
  if(gs.length){
    h+=gs.map(g=>{
      const ts=DB.tasks.filter(t=>t.goal===g.id), dn=ts.filter(t=>t.done).length;
      return '<div class="goal"><b>'+esc(g.name)+'</b>'
        +'<span class="gp">'+(ts.length?dn+' / '+ts.length+' 件':'还没有事')+(g.due?'　·　'+dShort(parseKey(g.due)):'')+'</span>'
        +'<button class="gdel" data-gdel="'+g.id+'">×</button></div>';
    }).join('');
  }else{
    h+='<div class="empty">还没有目标。一个就够——「考过四级」「把 v2 做完」。</div>';
  }
  if(gs.length<GOAL_MAX) h+='<div class="addrow"><input id="goalTitle" placeholder="＋ 一个目标"><input id="goalDue" class="due" placeholder="截止 12.12"><button class="go" id="goalAdd">加上</button></div>';
  return h;
}
function renderQmap(){
  const d=day(keyOf(cur),false), dusk=isDusk(), order=quadOrder();
  $('#qmap').innerHTML=order.map((k,i)=>{
    const q=QUADS.find(x=>x.k===k), s=d.quads[k]||{tags:[],note:''};
    const body=s.tags.length?s.tags.slice(0,5).map(t=>'<span>'+esc(t)+'</span>').join('')
      :'<em>＋ '+esc(dusk?q.hPM:q.hAM)+'</em>';
    return '<button class="qtile'+(k===openQuad?' on':'')+'" data-q="'+k+'">'
      +'<span class="qh"><i class="qi">'+pad(i+1)+'</i><span class="qn">'+q.n+'</span>'
      +'<span class="qc">'+(s.tags.length||'')+'</span></span>'
      +'<span class="qw">'+body+'</span></button>';
  }).join('');
}
function renderDesk(){
  const host=$('#desk');
  if(!openQuad){
    host.style.borderStyle='dashed'; host.style.background='transparent';
    host.innerHTML='<div class="dh"><span class="t" style="color:rgba(20,20,20,.35);font-weight:400">点上面任意一格开始写</span></div>';
    return;
  }
  host.style.borderStyle='solid'; host.style.background='rgba(255,255,255,.62)';
  const d=day(keyOf(cur),false), s=d.quads[openQuad]||{tags:[],note:''};
  const q=QUADS.find(x=>x.k===openQuad);
  const idx=quadOrder().indexOf(openQuad);
  host.innerHTML='<div class="dh"><span class="n">'+pad(idx+1)+'</span><span class="t">'+q.n+'</span>'
    +'<span class="s">已点 '+s.tags.length+' 个</span></div>'
    +'<div class="chips">'+TAGS[openQuad].map(t=>
      '<button class="chip'+(s.tags.includes(t)?' on':'')+'" data-t="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div>'
    +'<div class="notewrap"><textarea class="note" id="note" placeholder="＋ 补一句">'+esc(s.note)+'</textarea></div>';
  const ta=$('#note');
  ta.addEventListener('input',()=>{day(keyOf(cur)).quads[openQuad].note=ta.value;save();});
}

/* ============================================================
   课程表 + 空档推荐
   ============================================================ */
function weekOf(d){
  const K=window.KCB_DATA; if(!K||!K.semester_start)return 1;
  const s=new Date(K.semester_start+'T00:00:00');
  return Math.max(1,Math.floor((d-s)/86400000/7)+1);
}
function inWeeks(spec,w){
  return String(spec).split(',').some(p=>{const [a,b]=p.split('-').map(Number);return b?(w>=a&&w<=b):(w===a);});
}
function coursesOn(d){
  const K=window.KCB_DATA; if(!K)return [];
  const js=d.getDay(), day=js===0?7:js, w=weekOf(d);
  return (K.courses||[]).filter(c=>c.day===day&&inWeeks(c.weeks,w)).sort((a,b)=>a.start-b.start);
}
function periodT(p){
  const K=window.KCB_DATA, t=K&&K.normal_times&&K.normal_times[p];
  return t?{s:t.start,e:t.end}:{s:'--:--',e:'--:--'};
}
function hm(s){const [h,m]=s.split(':').map(Number);return h*60+m;}
function dur(m){const h=Math.floor(m/60),r=m%60;return (h?h+' 小时':'')+(r?r+' 分钟':'');}

function renderWeek(){
  const d=wkDay;
  $('#wkSub').textContent='第 '+weekOf(d)+' 周';
  const mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
  $('#days').innerHTML=Array.from({length:7},(_,i)=>{
    const x=new Date(mon); x.setDate(mon.getDate()+i);
    return '<button class="'+(keyOf(x)===keyOf(wkDay)?'on':'')+'" data-d="'+keyOf(x)+'">'+WEEK[x.getDay()]+'</button>';
  }).join('');
  const cs=coursesOn(d);
  const dn=day(keyOf(d),false);
  let rows=[], prevEnd=null;
  cs.forEach(c=>{
    const a=periodT(c.start), b=periodT(c.start+(c.span||2)-1);
    if(prevEnd!==null){
      const gap=hm(a.s)-hm(prevEnd);
      if(gap>=25) rows.push({free:true,at:b,start:prevEnd,mins:gap});
    }
    rows.push({free:false,at:a.s,name:c.name,room:(c.room||'')+(c.teacher?' · '+c.teacher:''),mins:hm(b.e)-hm(a.s)});
    prevEnd=b.e;
  });
  if(prevEnd){
    const left=22*60-hm(prevEnd);
    if(left>30) rows.push({free:true,start:prevEnd,mins:left,last:true});
  }
  if(!cs.length) rows.push({free:true,start:'08:00',mins:14*60,last:true,noClass:true});
  $('#tl').innerHTML=rows.map(r=>{
    if(r.free){
      const key=r.start;
      const plan=dn.gaps[key]||'';
      const cands=gapCandidates(r.mins);
      return '<div class="ev free"><div class="tm">'+r.start+'</div><div class="bd">'
        +'<div class="nm">'+(r.noClass?'今天没课，一整天都是你的':(r.last?'到睡觉前都空着':'空闲 '+dur(r.mins)))+'</div>'
        +(plan?'<div class="plan">· '+esc(plan)+' <button class="gh" data-cleargap="'+key+'" style="font-size:10px">清掉</button></div>':'')
        +(cands.length?'<div class="sugg">'+cands.map(t=>'<button data-gap="'+key+'" data-task="'+t.id+'">'+esc(t.title)+(t.min?' '+t.min+'m':'')+'</button>').join('')+'</div>'
          :'<div class="gh" style="margin-top:6px">＋ 安排点什么（任务里有活才会推荐）</div>')
        +'<input class="nt" data-gapinput="'+key+'" placeholder="或者自己写一句" value="'+esc(plan)+'">'
        +'</div></div>';
    }
    const note=dn.courseNotes[r.name]||'';
    return '<div class="ev"><div class="tm">'+r.at+'</div><div class="bd">'
      +'<div class="nm">'+esc(r.name)+'<span class="m">'+esc(r.room)+'</span></div>'
      +'<textarea class="nt" rows="1" data-course="'+esc(r.name)+'" placeholder="＋ 记一句">'+esc(note)+'</textarea>'
      +'</div></div>';
  }).join('')+'<div class="sec"><b>这天的速记</b></div><div class="sparklist">'+sparkRows(keyOf(d))+'</div>';
}
/* 空档推荐：先挑装得下的、还没做完的有限任务；重要不紧急优先，再按截止日 */
function gapCandidates(mins){
  const t=new Date(); const today=keyOf(t);
  return DB.tasks.filter(x=>!x.done&&(!x.min||x.min<=mins))
    .sort((a,b)=>{
      if((a.q===1)!==(b.q===1))return a.q===1?-1:1;
      return (a.due||'9999')<(b.due||'9999')?-1:1;
    }).slice(0,3);
}

function dailyStats(d){
  const keys=Object.keys(d.log||{}).filter(k=>(d.log[k]||0)>0).sort();
  let best=0,run=0,prev=null;
  keys.forEach(k=>{
    const t=parseKey(k).getTime();
    run=(prev!==null&&t-prev===86400000)?run+1:1;
    best=Math.max(best,run); prev=t;
  });
  return {total:keys.length,best:best};
}

   ============================================================ */
function volume(k){
  let n=0;
  DB.tasks.forEach(t=>{if(t.done&&t.doneAt===k)n++;});
  DB.daily.forEach(d=>{n+=(d.log[k]||0);});
  return n;
}
function volClass(n){return n<=0?'':(n<=2?'f1':(n<=5?'f2':'f3'));}
function monthVol(y,m){
  let n=0; const dim=new Date(y,m+1,0).getDate();
  for(let d=1;d<=dim;d++)n+=volume(keyOf(new Date(y,m,d)));
  return n;
}
function sparkRows(filterKey){
  const list=DB.sparks.slice().sort((a,b)=>(b.at||0)-(a.at||0))
    .filter(s=>!filterKey||keyOf(new Date(s.at))===filterKey).slice(0,40);
  if(!list.length) return '<div class="empty">还没有</div>';
  return list.map(s=>{const d=new Date(s.at);return '<div class="rl"><i>'+(d.getMonth()+1)+'.'+d.getDate()+'</i><span>'+esc(s.t)+'</span></div>';}).join('');
}
function renderReview(){
  const host=$('#revBody');
  $('#revBack').classList.toggle('hide',revView==='year');
  if(revView==='year'){
    $('#revTitle').textContent='回看';

    let cells='';
    for(let m=0;m<12;m++){
      const v=monthVol(y,m), cls=v<=0?'':(v<=10?'s1':(v<=30?'s2':(v<=60?'s3':'s4')));
      cells+='<button class="ym '+cls+'" data-m="'+m+'"><span class="n">'+(m+1)+' 月</span><span class="v">'+(v||'')+'</span></button>';
    }
    host.innerHTML='<div class="ygrid">'+cells+'</div>'
      +'<div class="sec" style="margin-top:16px"><b>日常连击</b>不扣分，只看攒了多少</div>'
      +streakRows()
      +'<div class="sec"><b>速记</b>'+(DB.sparks.length||0)+' 条</div><div class="sparklist">'+sparkRows()+'</div>'
      +'<div class="sec"><b>总数</b></div>'
      +'<div class="streak"><span class="nm">今年写下</span><span class="v">'+daysWrote(y)+' 天</span></div>'
      +'<div class="streak"><span class="nm">做成</span><span class="v">'+yearTotal(y)+' 件</span></div>';
    return;
  }
  if(revView==='month'){
    const d=parseKey(revDate||todayKey());
    $('#revTitle').textContent=(d.getMonth()+1)+' 月';
    const y=d.getFullYear(), m=d.getMonth();
    const first=new Date(y,m,1), start=new Date(first); start.setDate(1-((first.getDay()+6)%7));
    let cells='';
    for(let i=0;i<42;i++){
      const x=new Date(start); x.setDate(start.getDate()+i);
      const inM=x.getMonth()===m, v=inM?volume(keyOf(x)):0;
      const cls=['d'];
      if(!inM)cls.push('x'); else if(v)cls.push(volClass(v));
      if(keyOf(x)===todayKey()&&inM)cls.push('today');
      cells+='<div class="'+cls.join(' ')+'" data-day="'+keyOf(x)+'">'+x.getDate()+'</div>';
    }
    host.innerHTML='<div class="cal"><div class="wd">一</div><div class="wd">二</div><div class="wd">三</div><div class="wd">四</div><div class="wd">五</div><div class="wd">六</div><div class="wd">日</div>'+cells+'</div>'
      +'<div class="sec"><b>'+(m+1)+' 月</b>完成 '+monthVol(y,m)+' 次</div>'+streakRows();
    return;
  }
  // 日
  const d=parseKey(revDate||todayKey());
  $('#revTitle').textContent=dLabel(d);
  const dd=day(keyOf(d),false);
  const doneTasks=DB.tasks.filter(t=>t.done&&t.doneAt===keyOf(d));
  host.innerHTML=QUADS.map((q,i)=>{
    const s=dd.quads[q.k]||{tags:[],note:''};
    return '<div class="krow"><span class="n">'+pad(i+1)+'</span><div><div class="t">'+q.n+'</div>'
      +'<div class="w">'+(s.tags.length?s.tags.map(esc).join(' '):'<span style="color:rgba(20,20,20,.22)">没写</span>')+'</div>'
      +(s.note?'<div class="q">“'+esc(s.note)+'”</div>':'')+'</div></div>';
  }).join('')
    +'<div class="sec"><b>这天完成</b>'+(volume(keyOf(d))||'0')+' 次</div>'
    +(doneTasks.length?doneTasks.map(t=>'<div class="streak"><span class="nm">'+esc(t.title)+'</span><span class="v">做完</span></div>').join('')
      :'<div class="empty">这天没有完成记录</div>')
    +(function(){
      const k=wkKey(d), planN=weekIds(k).length;
      const wkd=DB.tasks.filter(t=>t.done&&t.doneAt&&wkKey(parseKey(t.doneAt))===k);
      const mins=wkd.reduce((s,t)=>s+(t.min||0),0);
      return '<div class="sec"><b>本周</b>挑了 '+planN+' 件 · 做成 '+wkd.length+' 件 · 花了 '+(mins/60).toFixed(1)+' 小时</div>';
    })();
}
function daysWrote(y){
  let n=0;
  Object.keys(DB.days).forEach(k=>{
    if(!k.startsWith(String(y)))return;
    const d=DB.days[k];
    if(QUADS.some(q=>filled(d.quads&&d.quads[q.k]||{tags:[],note:''})))n++;
  });
  return n;
}
function yearTotal(y){
  let n=0; DB.tasks.forEach(t=>{if(t.done&&t.doneAt&&t.doneAt.startsWith(String(y)))n++;});
  return n;
}
function streakRows(){
  if(!DB.daily.length)return '<div class="empty">还没有日常</div>';
  return DB.daily.map(d=>{
    const s=dailyStats(d);
    return '<div class="streak"><span class="nm">'+esc(d.title)+'</span><span class="v">累计 '+s.total+' 天 · 最长 '+s.best+' 天</span></div>';
  }).join('');
}

    const inp=$('#calTitle'), v=(inp&&inp.value||'').trim();
    if(v&&calDay){
      const tt=$('#calTime'), tm=(tt&&tt.value||'').trim();
      DB.tasks.push({id:uid(),title:v,q:openT,min:25,start:todayKey(),due:calDay,time:/^\d{1,2}:\d{2}$/.test(tm)?tm:'',done:false,doneAt:null,goal:''});
      save(); renderTasks();
    }
    return;
  }
  const aq=e.target.closest('button[data-aq]');
  if(aq){ newTaskQ=+aq.dataset.aq; renderTdesk(); return; }
  const qb=e.target.closest('button[data-quota]');
  if(qb){ newQuota=+qb.dataset.quota; ('#dlyQRow button').forEach(x=>x.classList.toggle('on',x===qb)); return; }
  if(e.target.id==='dlyAdd'){ addDaily(); return; }
  if(e.target.id==='tAdd'){
    const inp=$('#tTitle'), v=(inp&&inp.value||'').trim();
    if(v){
      const k=todayKey();
      const gs=$('#tGoal'); DB.tasks.push({id:uid(),title:v,q:newTaskQ,min:25,start:k,due:k,done:false,doneAt:null,goal:gs?gs.value:''});
      save(); renderTasks();
    }
    return;
  }
  const mv=e.target.closest('[data-mv]');
  if(mv){
    const x=DB.tasks.find(y=>y.id===mv.dataset.mv);
    if(x){x.due=todayKey();save();renderTasks();}
    return;
  }
  const t=e.target.closest('.task[data-tid]');
  if(t){
    const x=DB.tasks.find(y=>y.id===t.dataset.tid);
    if(x){x.done=!x.done;x.doneAt=x.done?todayKey():null;save();renderTasks();}
  }
});
$('#taskBody').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='dlyTitle'){ addDaily(); }
});
$('#revSeg').addEventListener('click',e=>{
  const b=e.target.closest('button[data-v]'); if(!b)return;
  revView=b.dataset.v;
  $$('#revSeg button').forEach(x=>x.classList.toggle('on',x===b));
  if(revView==='month'&&!revDate)revDate=todayKey();
  renderReview();
});
$('#revBack').onclick=()=>{revView='month';$$('#revSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v==='month'));renderReview();};
$('#revBody').addEventListener('click',e=>{
  const m=e.target.closest('.ym'); if(m){revMonth=+m.dataset.m;revDate=new Date().getFullYear()+'-'+pad(revMonth+1)+'-01';revView='month';$$('#revSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v==='month'));renderReview();return;}
  const d=e.target.closest('.d[data-day]'); if(d){revDate=d.dataset.day;revView='day';$$('#revSeg button').forEach(x=>x.classList.toggle('on',x.dataset.v==='day'));renderReview();}
});
$('#wkp').addEventListener('click',e=>{
  if(e.target.closest('[data-open]')){ wkPickOpen=true; renderWkp(); return; }
  if(e.target.closest('[data-close]')){ wkPickOpen=false; renderWkp(); return; }
  const pk=e.target.closest('[data-pick]');
  if(pk){ const k=wkKey(cur), ids=weekIds(k); if(ids.length<3&&ids.indexOf(pk.dataset.pick)<0){ids.push(pk.dataset.pick); setWeekIds(k,ids);} renderWkp(); return; }
  const up=e.target.closest('[data-unpick]');
  if(up){ const k=wkKey(cur); setWeekIds(k,weekIds(k).filter(x=>x!==up.dataset.unpick)); renderWkp(); return; }
  const w=e.target.closest('[data-wtid]');
  if(w){ const x=DB.tasks.find(y=>y.id===w.dataset.wtid); if(x){x.done=!x.done;x.doneAt=x.done?todayKey():null;save();renderWkp();} }
});
$('#taskBody').addEventListener('click',e=>{
  if(e.target.id==='goalAdd'){
    const n=$('#goalTitle'), v=(n&&n.value||'').trim();
    if(v&&DB.goals.length<GOAL_MAX){
      const due=$('#goalDue');
      DB.goals.push({id:uid(),name:v,due:parseDue(due&&due.value),why:''});
      save(); renderTasks();
    }
    return;
  }
  const gd=e.target.closest('[data-gdel]');
  if(gd){ DB.goals=DB.goals.filter(g=>g.id!==gd.dataset.gdel); DB.tasks.forEach(x=>{if(x.goal===gd.dataset.gdel)x.goal='';}); save(); renderTasks(); }
});
$('#fab').onclick=openCurtain;
$('#scrim').onclick=closeCurtain;
$('#sparkCancel').onclick=closeCurtain;
$('#sparkTa').addEventListener('input',e=>{$('#sparkLen').textContent=e.target.value.length;});
$('#sparkSave').onclick=()=>{
  const v=$('#sparkTa').value.trim();
  if(v){DB.sparks.push({t:v,at:Date.now()});save();}
  closeCurtain();
};
/* 时钟 */
function tick(){const d=new Date();$('#clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());}
tick();setInterval(tick,20000);

/* 启动 */
openQuad=quadOrder()[0];
renderToday(); renderWeek(); renderTasks(); renderReview();

/* 记住「昨天写了什么」：打开今天时，把昨天未来·事件的词带过来问一句 */
(function initYday(){
  const t=new Date(); t.setHours(0,0,0,0);
  const y=new Date(t); y.setDate(t.getDate()-1);
  const yk=keyOf(y);
  if(DB.yday&&DB.yday.day===yk)return;
  const yd=day(yk,false).quads.future_event;
  if(yd.tags.length||yd.note.trim()){
    DB.yday={day:yk,text:yd.tags[0]||yd.note.slice(0,24),state:''};
    save();
  }
  renderToday();
})();

/* 直接打开某一屏：#week #tasks #review #spark */
(function(){
  const h=location.hash.slice(1);
  if(['week','tasks','review'].indexOf(h)>=0)go(h);
  if(h==='spark')openCurtain();
})();
</script>
